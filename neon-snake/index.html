<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    h1 {
      color: #00ffcc; font-size: 2rem; letter-spacing: 0.3em;
      text-transform: uppercase;
      text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
      margin-bottom: 12px;
    }
    #scoreboard { display: flex; gap: 40px; margin-bottom: 16px; }
    .score-item { text-align: center; }
    .score-label { color: #555; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .score-value { color: #fff; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
    #wrap { position: relative; }
    canvas { border: 1px solid #00ffcc44; box-shadow: 0 0 30px #00ffcc22; border-radius: 4px; display: block; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #0a0a0fcc;
    }
    .overlay-title { font-size: 2.5rem; font-weight: bold; letter-spacing: 0.2em; text-transform: uppercase; }
    .overlay-sub { color: #888; font-size: 0.85rem; letter-spacing: 0.15em; }
    #start-btn {
      padding: 12px 36px; background: transparent;
      border: 1px solid #00ffcc; color: #00ffcc;
      font-family: 'Courier New', monospace; font-size: 1rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 0 10px #00ffcc44;
    }
    #start-btn:hover { background: #00ffcc22; box-shadow: 0 0 20px #00ffcc88; }
    #hint { margin-top: 16px; color: #444; font-size: 0.7rem; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div id="scoreboard">
    <div class="score-item"><div class="score-label">Score</div><div class="score-value" id="score">0</div></div>
    <div class="score-item"><div class="score-label">Best</div><div class="score-value" id="best">0</div></div>
  </div>
  <div id="wrap">
    <canvas id="canvas" width="420" height="420"></canvas>
    <div id="overlay">
      <div class="overlay-title" id="ov-title" style="color:#00ffcc;text-shadow:0 0 20px #00ffcc;">Ready</div>
      <div class="overlay-sub" id="ov-sub">Navigate the neon grid</div>
      <button id="start-btn">Start Game</button>
    </div>
  </div>
  <div id="hint">Arrow Keys / WASD to move</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;
    const TICK = 130;

    let snake, dir, nextDir, food, score, particles, running, tickId, rafId;
    let best = parseInt(localStorage.getItem('ns-best') || '0');
    bestEl.textContent = best;

    function rand(n) { return Math.floor(Math.random() * n); }

    function spawnFood() {
      const used = new Set(snake.map(s => s.x + ',' + s.y));
      let p;
      do { p = { x: rand(COLS), y: rand(ROWS) }; }
      while (used.has(p.x + ',' + p.y));
      return p;
    }

    function addParticles(x, y) {
      for (let i = 0; i < 12; i++) {
        const a = Math.PI * 2 * i / 12 + Math.random() * 0.5;
        const s = 1.5 + Math.random() * 3;
        particles.push({ x: x * GRID + GRID/2, y: y * GRID + GRID/2, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1 });
      }
    }

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = spawnFood();
      score = 0;
      particles = [];
      scoreEl.textContent = 0;
    }

    function tick() {
      // apply queued direction (no reversals)
      if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = { ...nextDir };

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }

      // self — exclude tail (it will vacate this frame)
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) { die(); return; }
      }

      const ate = head.x === food.x && head.y === food.y;
      snake.unshift(head);
      if (!ate) {
        snake.pop();
      } else {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('ns-best', best); }
        addParticles(head.x, head.y);
        food = spawnFood();
      }
    }

    function die() {
      running = false;
      clearInterval(tickId);
      ovTitle.textContent = 'Game Over';
      ovTitle.style.color = '#ff2d78';
      ovTitle.style.textShadow = '0 0 20px #ff2d78';
      ovSub.textContent = 'Score: ' + score;
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function render() {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // grid lines
      ctx.strokeStyle = '#ffffff07';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*GRID,0); ctx.lineTo(x*GRID,canvas.height); ctx.stroke(); }
      for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*GRID); ctx.lineTo(canvas.width,y*GRID); ctx.stroke(); }

      // particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.055; p.vx *= 0.93; p.vy *= 0.93;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 8; ctx.shadowColor = '#ff2d78'; ctx.fillStyle = '#ff2d78';
        ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // food
      const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 180);
      ctx.save(); ctx.shadowBlur = 18 * pulse; ctx.shadowColor = '#ff2d78'; ctx.fillStyle = '#ff2d78';
      ctx.fillRect(food.x*GRID + 4, food.y*GRID + 4, GRID-8, GRID-8);
      ctx.restore();

      // snake
      snake.forEach((seg, i) => {
        const t = 1 - i / snake.length;
        const a = 0.25 + t * 0.75;
        ctx.save();
        ctx.shadowBlur = i === 0 ? 22 : 8;
        ctx.shadowColor = `rgba(0,255,204,${a})`;
        ctx.fillStyle = `rgba(0,255,204,${a})`;
        const pad = i === 0 ? 1 : 2;
        ctx.fillRect(seg.x*GRID + pad, seg.y*GRID + pad, GRID - pad*2, GRID - pad*2);
        ctx.restore();
      });

      rafId = requestAnimationFrame(render);
    }

    function startGame() {
      clearInterval(tickId);
      cancelAnimationFrame(rafId);
      init();
      running = true;
      overlay.style.display = 'none';
      tickId = setInterval(tick, TICK);
      render();
    }

    startBtn.addEventListener('click', startGame);

    document.addEventListener('keydown', e => {
      const map = {
        ArrowUp:{x:0,y:-1}, w:{x:0,y:-1},
        ArrowDown:{x:0,y:1}, s:{x:0,y:1},
        ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0},
        ArrowRight:{x:1,y:0}, d:{x:1,y:0}
      };
      const nd = map[e.key];
      if (!nd) return;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
      nextDir = nd;
    });

    let ts = null;
    canvas.addEventListener('touchstart', e => { ts = e.touches[0]; }, { passive: true });
    canvas.addEventListener('touchend', e => {
      if (!ts || !running) return;
      const dx = e.changedTouches[0].clientX - ts.clientX;
      const dy = e.changedTouches[0].clientY - ts.clientY;
      if (Math.abs(dx) > Math.abs(dy)) nextDir = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
      else nextDir = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
      ts = null;
    }, { passive: true });
  </script>
</body>
</html>
